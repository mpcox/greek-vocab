<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Greek">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Greek vocab</title>
<style>
:root{--bg:#f7f5f0;--fg:#1d1d1f;--mut:#6b6b70;--card:#fff;--line:#d9d6cf;--acc:#2b4a8b;--ok:#2f7d4f;--okbg:#e0f2e7;--bad:#b3392f;--badbg:#f8e1de;--warn:#9a6a00;--warnbg:#fbf0d3}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--fg:#f0eee9;--mut:#9a9aa0;--card:#1f1f23;--line:#38383e;--acc:#8fb0ff;--ok:#6fcf97;--okbg:#17352437;--bad:#ff8b80;--badbg:#3a1e1c;--warn:#f0c14b;--warnbg:#3a3015}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit}
.greek{font-family:"Palatino","Palatino Linotype","Times New Roman",serif}
#study{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:max(env(safe-area-inset-top),8px) 14px max(env(safe-area-inset-bottom),10px);max-width:640px;margin:0 auto}
#top{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:13px;min-height:22px}
#top .rung{letter-spacing:.02em}
#syncdot{font-size:12px;color:var(--warn)}
#wordbox{flex:0 0 auto;text-align:center;padding:2vh 0 1vh}
#lemma{font-size:clamp(46px,15.5vw,92px);line-height:1.08;margin:0;word-break:break-word}
#forms{color:var(--mut);font-size:clamp(14px,3.8vw,18px);margin-top:4px;max-height:2.8em;overflow:hidden}
#phrase{font-size:clamp(30px,8.6vw,52px);line-height:1.25}
#phrase .t{color:var(--acc);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}
#ask{color:var(--mut);font-size:14px;margin-top:6px}
#switchrow{display:flex;justify-content:center;margin:2px 0 8px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:9px 26px;font-size:16px;font-weight:600;color:var(--mut)}
.seg button.on.sure{background:var(--acc);color:#fff}
.seg button.on.guess{background:var(--warn);color:#fff}
#opts{flex:1 1 auto;display:flex;flex-direction:column;gap:9px;min-height:0}
.opt{flex:1 1 0;min-height:52px;max-height:110px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;font-size:clamp(17px,4.6vw,22px);padding:6px 14px;text-align:left;display:flex;align-items:center;gap:12px;touch-action:manipulation}
.opt .k{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);font-size:13px;color:var(--mut);display:flex;align-items:center;justify-content:center}
.opt:active{background:var(--line)}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.opt.dim{opacity:.55}
#idk{flex:0 0 auto;margin-top:9px;min-height:50px;border:1.5px dashed var(--line);background:transparent;border-radius:14px;font-size:18px;color:var(--mut)}
#study.fbmode #switchrow,#study.fbmode #idk{display:none}
#study.fbmode #opts{flex:0 0 auto;gap:6px}
#study.fbmode .opt{flex:none;min-height:44px;max-height:none;font-size:16px;padding:6px 12px}
#study.fbmode #fb{flex:1 1 auto;min-height:0;max-height:none}
#fb{flex:0 0 auto;margin-top:9px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;max-height:46vh;overflow:auto}
#fb.ok{border-color:var(--ok)}#fb.bad{border-color:var(--bad)}
#fb .head{font-weight:700;margin-bottom:3px}
#fb .head.ok{color:var(--ok)}#fb .head.bad{color:var(--bad)}#fb .head.warn{color:var(--warn)}
#fb .gloss{font-size:17px}
#fb .full{color:var(--mut);font-size:14px;margin-top:2px}
#fb .aid{margin-top:6px;font-size:14px}
#fb .flagnote{margin-top:6px;font-size:14px;background:var(--warnbg);border-radius:8px;padding:6px 8px}
#fb .row{display:flex;gap:14px;margin-top:8px;font-size:14px;align-items:center}
#fb a{color:var(--acc)}
.linkbtn{background:none;border:0;color:var(--acc);padding:0;font-size:14px;text-decoration:underline}
#next{flex:0 0 auto;margin-top:9px;min-height:54px;border:0;border-radius:14px;background:var(--acc);color:#fff;font-size:19px;font-weight:700;width:100%}
#grade{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
#grade button{min-height:54px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;font-size:17px;font-weight:600}
#grade .g-cs{border-color:var(--ok);color:var(--ok)}#grade .g-cg{border-color:var(--warn);color:var(--warn)}#grade .g-wg{border-color:var(--bad);color:var(--bad)}#grade .g-ws{border-color:var(--bad);color:var(--bad);background:var(--badbg)}
#reveal{flex:1 1 auto;margin-top:9px;min-height:80px;border:0;border-radius:14px;background:var(--acc);color:#fff;font-size:22px;font-weight:700}
.hidden{display:none!important}
#hint{text-align:center;color:var(--mut);font-size:12px;padding:6px 0 0}
#below{max-width:640px;margin:0 auto;padding:16px 14px 80px}
#below h2{font-size:18px;margin:22px 0 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px}.stat span{color:var(--mut);font-size:12px}
.bar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--line);margin-top:6px}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mut);margin-top:6px}
.legend u{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;text-decoration:none}
table{width:100%;border-collapse:collapse;font-size:15px}td{padding:5px 4px;border-bottom:1px solid var(--line)}
.tools button{margin:4px 8px 4px 0;padding:9px 14px;border:1.5px solid var(--line);background:var(--card);border-radius:10px}
.note{color:var(--mut);font-size:13px;margin-top:8px}.note.good{color:var(--ok)}.note.err{color:var(--bad)}
.form label{display:block;font-size:13px;color:var(--mut);margin-top:10px}.form input{display:block;width:100%;margin-top:4px;padding:10px;font-size:16px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
#alert{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:6px 10px;font-size:13px;margin-top:4px;text-align:center}
#sheet{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:5}
#sheet .in{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px 16px max(env(safe-area-inset-bottom),16px)}
#sheet button{display:block;width:100%;min-height:50px;margin-top:8px;border:1.5px solid var(--line);background:transparent;border-radius:12px;font-size:17px}
</style>
</head>
<body>
<div id="study">
  <div id="top"><span id="count"></span><span id="syncdot"></span><span class="rung" id="rung"></span></div>
  <div id="alert" class="hidden"></div>
  <div id="wordbox">
    <h1 id="lemma" class="greek"></h1>
    <div id="phrase" class="greek hidden"></div>
    <div id="forms" class="greek"></div>
    <div id="ask"></div>
  </div>
  <div id="switchrow"><div class="seg" id="seg"><button class="sure on" data-v="sure">Sure</button><button class="guess" data-v="guess">Guess</button></div></div>
  <div id="opts"></div>
  <button id="idk">? I don't know</button>
  <button id="reveal" class="hidden">Show answer</button>
  <div id="fb" class="hidden"></div>
  <div id="grade" class="hidden"></div>
  <button id="next" class="hidden">Next</button>
  <div id="hint">Scroll down for progress</div>
</div>
<div id="below">
  <h2>Progress</h2>
  <div class="stats" id="stats"></div>
  <h2>Where your words sit</h2>
  <div class="bar" id="bar"></div><div class="legend" id="legend"></div>
  <h2>Weakest words</h2>
  <table id="weak"></table>
  <h2>Sync</h2>
  <div class="form">
    <label>Repository<input id="repoIn" autocapitalize="none" autocomplete="off" spellcheck="false"></label>
    <label>This device's name<input id="deviceIn" autocapitalize="none" autocomplete="off" spellcheck="false"></label>
    <label>Token<input id="tokenIn" type="password" autocapitalize="none" autocomplete="off" spellcheck="false"></label>
    <label>Token expires on (so I can warn you)<input id="expIn" type="date"></label>
  </div>
  <div class="tools"><button id="saveCfg">Save</button><button id="syncBtn">Sync now</button><button id="forgetTok">Forget token</button></div>
  <div class="note" id="syncStatus"></div>
  <h2>Preview</h2>
  <div class="tools"><b style="display:block;margin:4px 0">Preview a rung (not recorded)</b><button data-prev="1">Rung 1</button><button data-prev="2">Rung 2</button><button data-prev="3">Rung 3</button><button data-prev="4">Rung 4</button></div>
  <h2>Data</h2>
  <div class="tools"><button id="exportBtn">Export a backup</button><button id="resetBtn">Erase this device's progress</button></div>
  <div id="exportBox"></div>
  <div class="note" id="dataNote"></div>
</div>
<div id="sheet" class="hidden"><div class="in"><b>What looks wrong?</b>
  <button data-f="gloss">The English meaning</button><button data-f="greek">The Greek (form, accent)</button><button data-f="phrase">The phrase or its translation</button><button data-f="other">Something else</button><button data-f="cancel" style="border-style:dashed">Cancel</button></div></div>
<script>/* Greek vocab learning engine. Pure functions, no DOM, no storage.
   State is always rebuilt by replaying the merged event logs (see replay()). */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.GreekEngine = factory();
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  const DAY = 86400000;
  const CFG = {
    ALGO_VERSION: 1,
    BOX_DAYS: [0, 0.01, 1, 3, 7, 16, 35], // interval after reaching each box
    MAX_BOX: 6,
    WRONG_DELAY: 45 * 1000,        // wrong answers return within about a dozen cards
    GUESS_DELAY: 3 * 60 * 1000,    // correct-but-guessed returns soon
    MAX_WEAK: 10,                  // weak-backlog limit: no new words at or above this
    BAND: 50,                      // words unlocked in bands of 50 by frequency
    UNLOCK_FRACTION: 0.7,          // share of unlocked words at box>=3 that opens the next band
    NEW_EVERY: 3,                  // with reviews due, one new word per this many cards
    RECENT: 3,                     // do not repeat any of the last N cards
    N_OPTIONS: 4,
  };

  const rungOf = (box) => (box < 2 ? 1 : box < 4 ? 2 : box < 5 ? 3 : 4);
  const OUTCOMES = ["cs", "cg", "ws", "wg", "q"]; // correct+sure, correct+guess, wrong+sure, wrong+guess, "?"

  /* ---------- events and replay ---------- */
  function newWord() {
    return { box: 0, seen: 0, right: 0, last: 0, due: 0, fb: false, lapses: 0,
             r3: null, r4: null, conf: {} };
  }

  function apply(state, ev) {
    const s = state.words[ev.w] || (state.words[ev.w] = newWord());
    if (ev.out === "seed") { // starting point imported from the earlier typed practice
      s.box = ev.box; s.seen = ev.seen; s.right = ev.right; s.last = ev.t;
      s.due = ev.t + (ev.dueIn || 0) * DAY; s.fb = !!ev.fb; state.n++;
      return state;
    }
    const prevDue = s.seen ? s.due : 0;
    s.seen++; s.last = ev.t;
    const good = ev.out === "cs" || ev.out === "cg";
    if (good) s.right++;
    const early = ev.out === "cs" && prevDue > ev.t; // practised before it was due: no promotion
    if (ev.out === "cs") { if (!early) s.box = Math.min(CFG.MAX_BOX, s.box + 1); }
    else if (ev.out === "ws") { s.box = Math.max(0, s.box - 2); s.fb = true; s.lapses++; }
    else if (ev.out === "wg" || ev.out === "q") { s.box = Math.max(0, s.box - 1); s.lapses++; }
    // cg: box unchanged
    if (early) s.due = prevDue;
    else if (ev.out === "cs") s.due = ev.t + CFG.BOX_DAYS[s.box] * DAY;
    else if (ev.out === "cg") s.due = ev.t + CFG.GUESS_DELAY;
    else s.due = ev.t + CFG.WRONG_DELAY;
    if (s.box >= 4) s.fb = false;
    if (!good && ev.pick) s.conf[ev.pick] = (s.conf[ev.pick] || 0) + 1;
    // learned = pass at rung 3 and at rung 4 on different days
    if (ev.rung === 3) s.r3 = ev.out === "cs" ? ev.day : null;
    if (ev.rung === 4) s.r4 = ev.out === "cs" ? ev.day : null;
    state.n++;
    return state;
  }

  function isLearned(s) { return !!(s && s.r3 && s.r4 && s.r3 !== s.r4); }

  // Merge any number of event arrays; duplicates (same id) are ignored; order is
  // (time, id) so every device that sees the same events computes the same state.
  function mergeEvents(...logs) {
    const seen = new Map();
    for (const log of logs) for (const e of log) if (!seen.has(e.id)) seen.set(e.id, e);
    return [...seen.values()].sort((a, b) => a.t - b.t || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
  }
  function replay(events) {
    const st = { words: {}, n: 0 };
    for (const e of mergeEvents(events)) apply(st, e);
    return st;
  }

  /* ---------- seeded random ---------- */
  function rngFrom(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, rng) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  /* ---------- deck helpers ---------- */
  function makeDeck(cards) {
    const byId = new Map(cards.map((c) => [c.id, c]));
    const byCls = new Map();
    for (const c of cards) { if (!byCls.has(c.cls)) byCls.set(c.cls, []); byCls.get(c.cls).push(c); }
    return { cards, byId, byCls };
  }
  const firstGloss = (c) => c.g.toLowerCase().split(/[,;(]/)[0].trim();
  // Classes too small to supply distractors borrow from these.
  const SPECIAL_POOLS = { "definite article": ["pronoun", "conjunction", "preposition"], interjection: ["adverb", "conjunction", "pronoun"] };

  /* ---------- distractors ---------- */
  // rung 1: same class (same sub-type preferred), no look-alikes.
  // rung 2-3: look-alikes and previously confused words go first.
  function distractors(card, rung, deck, state, rng, n) {
    n = n || CFG.N_OPTIONS - 1;
    const np = new Set(card.np || []);
    const la = new Set(rung >= 2 ? card.la || [] : []);
    const conf = (state && state.words[card.id] && state.words[card.id].conf) || {};
    let pool = (deck.byCls.get(card.cls) || []).filter((c) => c.id !== card.id);
    if (pool.length < 6 && SPECIAL_POOLS[card.cls]) {
      pool = [];
      for (const k of SPECIAL_POOLS[card.cls]) pool.push(...(deck.byCls.get(k) || []));
    }
    const target1 = firstGloss(card);
    const score = (c) => {
      let s = rng() * 5;
      if (la.has(c.id)) s += 100;
      if (rung >= 2 && conf[c.id]) s += 80 + 10 * conf[c.id];
      if (c.sub && c.sub === card.sub) s += 20;
      if (c.grp === card.grp) s += 10;
      return s;
    };
    const ok = (c) => !np.has(c.id) && (c.np || []).indexOf(card.id) < 0 && firstGloss(c) !== target1;
    const ranked = pool.filter(ok).map((c) => [score(c), c]).sort((a, b) => b[0] - a[0]).map((x) => x[1]);
    const picked = []; const glosses = new Set([target1]);
    for (const c of ranked) {
      const g = firstGloss(c);
      if (glosses.has(g)) continue;
      picked.push(c); glosses.add(g);
      if (picked.length === n) break;
    }
    return picked;
  }

  // Build a multiple-choice question: options shuffled, index of correct answer.
  function makeQuestion(card, rung, deck, state, rng) {
    const ds = distractors(card, rung, deck, state, rng);
    const opts = shuffle([card, ...ds], rng);
    return { id: card.id, rung, options: opts.map((c) => ({ id: c.id, text: c.g })),
             correct: opts.findIndex((c) => c.id === card.id) };
  }

  /* ---------- choosing the next card ---------- */
  function bandLimit(state, deck) {
    let limit = CFG.BAND;
    const total = deck.cards.length;
    while (limit < total) {
      const upTo = deck.cards.filter((c) => c.id <= limit);
      const solid = upTo.filter((c) => { const s = state.words[c.id]; return s && s.box >= 3; }).length;
      if (solid / upTo.length >= CFG.UNLOCK_FRACTION) limit += CFG.BAND; else break;
    }
    return Math.min(limit, total);
  }

  function counts(state) {
    let weak = 0, seen = 0, learned = 0;
    for (const k in state.words) {
      const s = state.words[k]; seen++;
      if (s.box < 2) weak++;
      if (isLearned(s)) learned++;
    }
    return { weak, seen, learned };
  }

  // session: { recent: [ids], sinceNew: n }
  function nextCard(state, deck, now, session) {
    session = session || { recent: [], sinceNew: 99 };
    const recent = new Set((session.recent || []).slice(-CFG.RECENT));
    const seenIds = Object.keys(state.words).map(Number);
    const c = counts(state);
    const limit = bandLimit(state, deck);
    const unseen = deck.cards.find((x) => x.id <= limit && !state.words[x.id]);
    const dueAll = seenIds.filter((id) => state.words[id].due <= now);
    const pick = (ids) => ids.filter((id) => !recent.has(id));
    let due = pick(dueAll);
    const score = (id) => {
      const s = state.words[id];
      const interval = Math.max(CFG.WRONG_DELAY, CFG.BOX_DAYS[s.box] * DAY);
      return (now - s.due) / interval + (s.box < 2 ? 5 : 0) + (s.fb ? 2 : 0);
    };
    due.sort((a, b) => score(b) - score(a));
    const newOk = unseen && c.weak < CFG.MAX_WEAK;
    let kind, id;
    if (newOk && (due.length === 0 || session.sinceNew >= CFG.NEW_EVERY)) { kind = "new"; id = unseen.id; }
    else if (due.length) { kind = "review"; id = due[0]; }
    else if (seenIds.length) {
      // nothing (non-recent) due and no new words allowed: practise whatever is closest to due
      const fresh = pick(seenIds);
      const ids = (fresh.length ? fresh : seenIds).slice();
      ids.sort((a, b) => state.words[a].due - state.words[b].due);
      kind = state.words[ids[0]].due <= now ? "review" : "early"; id = ids[0];
    } else { kind = "new"; id = deck.cards[0].id; }
    const s = state.words[id];
    return { id, kind, rung: rungOf(s ? s.box : 0) };
  }

  function summary(state, deck) {
    const boxes = [0, 0, 0, 0, 0, 0, 0];
    let right = 0, seen = 0, fb = 0;
    for (const k in state.words) { const s = state.words[k]; boxes[s.box]++; right += s.right; seen += s.seen; if (s.fb) fb++; }
    const c = counts(state);
    return { introduced: c.seen, learned: c.learned, weak: c.weak, falseBeliefs: fb,
             boxes, accuracy: seen ? right / seen : null, answers: seen, band: bandLimit(state, deck) };
  }

  return { CFG, DAY, OUTCOMES, rungOf, apply, isLearned, mergeEvents, replay, rngFrom, shuffle,
           makeDeck, distractors, makeQuestion, nextCard, bandLimit, counts, summary, firstGloss };
});
</script><script>/* Storage: IndexedDB when available, otherwise memory (+ localStorage mirror for small data).
   All methods are async so both back ends look identical. */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.GreekStorage = factory();
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  function memoryStore() {
    const events = new Map(), flags = new Map(), meta = new Map();
    return {
      kind: "memory",
      async loadEvents() { return [...events.values()]; },
      async putEvents(list) { for (const e of list) events.set(e.id, e); },
      async loadFlags() { return [...flags.values()]; },
      async putFlags(list) { for (const f of list) flags.set(f.id, f); },
      async getMeta(k, d) { return meta.has(k) ? meta.get(k) : d; },
      async setMeta(k, v) { meta.set(k, v); },
      async clearAll() { events.clear(); flags.clear(); meta.clear(); },
    };
  }

  function idbStore(name) {
    const open = () => new Promise((res, rej) => {
      const r = indexedDB.open(name, 1);
      r.onupgradeneeded = () => {
        const db = r.result;
        db.createObjectStore("events", { keyPath: "id" });
        db.createObjectStore("flags", { keyPath: "id" });
        db.createObjectStore("meta");
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return open().then((db) => {
      const tx = (stores, mode, fn) => new Promise((res, rej) => {
        const t = db.transaction(stores, mode); const out = fn(t);
        t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
        t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
      });
      const getAll = (s) => new Promise((res, rej) => { const r = db.transaction(s).objectStore(s).getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
      return {

        loadFlags: () => getAll("flags"),
        putFlags: (list) => tx("flags", "readwrite", (t) => { const s = t.objectStore("flags"); for (const f of list) s.put(f); }),
        getMeta: (k, d) => new Promise((res, rej) => { const r = db.transaction("meta").objectStore("meta").get(k); r.onsuccess = () => res(r.result === undefined ? d : r.result); r.onerror = () => rej(r.error); }),

        clearAll: () => tx(["events", "flags", "meta"], "readwrite", (t) => { for (const s of ["events", "flags", "meta"]) t.objectStore(s).clear(); }),

  }

  async function openStore(name) {
    try {
      if (typeof indexedDB === "undefined") return memoryStore();

    } catch (e) { return memoryStore(); }
  }

  async function requestPersistence() {
    try { return !!(navigator.storage && navigator.storage.persist && (await navigator.storage.persist())); } catch (e) { return false; }

   Layout on the data branch:
     logs/<device>-<YYYY-MM>.json   answers made on that device in that month (only that device writes it)
     flags/<device>.json            error reports from that device
     summary.json                   small progress summary (any device may refresh it)
   Everything is injected (fetch, storage, clock) so it can be tested against a fake GitHub. */

  function b64(str) {

    let detail = ""; try { detail = (await r.json()).message || ""; } catch (e) {}

    if (r.status === 403) return new SyncError("GitHub refused (403): the token may lack permission, or you hit a rate limit. " + detail, "auth");
    if (r.status === 404) return new SyncError("Not found (404): check the repository name, that the 'data' branch exists, and that the token can access it. " + detail, "config");

  function create(deps) {

    const cfg = () => deps.cfg();

    else if (k === "s" || k === "S") { if (!cur.answered) setSure(!sure); }
    else if (k === "0" || k === "?") { if (cur.q && !cur.answered) answer(-1); }
    else if (k === "Enter" || k === " ") {
      e.preventDefault();
      if (!$("next").classList.contains("hidden")) next();
      else if (!$("reveal").classList.contains("hidden")) $("reveal").click();
    }
  });

  /* ---------- stats below the fold ---------- */
  const BOXCOL = ["#b3392f", "#d9772b", "#d9b52b", "#8ab33a", "#3f9a5a", "#2b6fb3", "#4b4bb3"];
  function renderStats() {
    const s = E.summary(state, deck);
    const st = $("stats"); st.textContent = "";
    const add = (n, l) => { const d = el("div", "stat"); d.append(el("b", null, String(n)), el("span", null, l)); st.append(d); };
    add(s.introduced + " / " + deck.cards.length, "words met");
    add(s.learned, "learned");
    add(s.weak, "weak now");
    add(s.accuracy == null ? "–" : Math.round(s.accuracy * 100) + "%", "accuracy");
    add(s.falseBeliefs, "false beliefs");
    add(s.band, "unlocked");
    const bar = $("bar"); bar.textContent = ""; const lg = $("legend"); lg.textContent = "";
    const total = Math.max(1, s.introduced);
    const names = ["new/weak", "shaky", "building", "solid", "in context", "recall", "mastered"];
    s.boxes.forEach((n, i) => {
      const seg = el("i"); seg.style.width = (100 * n / total) + "%"; seg.style.background = BOXCOL[i]; bar.append(seg);
      const l = el("span"); const u = el("u"); u.style.background = BOXCOL[i]; l.append(u, names[i] + " " + n); lg.append(l);
    });
    const weak = Object.keys(state.words).map((k) => ({ id: +k, s: state.words[k] }))
      .sort((a, b) => a.s.box - b.s.box || (b.s.fb - a.s.fb) || b.s.lapses - a.s.lapses).slice(0, 8);
    const tb = $("weak"); tb.textContent = "";
    for (const w of weak) {
      const c = deck.byId.get(w.id), tr = el("tr");
      const g = el("td", "greek", c.lemma); g.style.fontSize = "18px";
      tr.append(g, el("td", null, c.g), el("td", null, "box " + w.s.box + (w.s.fb ? " ⚑" : "")));
      tb.append(tr);
    }
    if (!weak.length) { const tr = el("tr"); tr.append(el("td", null, "Nothing yet.")); tb.append(tr); }
    renderDataNote();
  }
  const myEvents = () => events.filter((e) => cfg.ownNames.includes(e.d) && e.out !== "seed");
  async function renderDataNote() {
    const pend = await syncer.pending().catch(() => 0);
    $("syncdot").textContent = cfg.token && pend > 0 ? (navigator.onLine ? "⟳ " : "○ ") + pend + " waiting to sync" : "";
    const last = await store.getMeta("lastSync", 0);
    $("dataNote").textContent = myEvents().length + " answers on this device (" + device() + "), " + events.filter((e) => e.out !== "seed").length + " in total across devices, " + flags.length + " reports. " +
      (cfg.token ? pend + " waiting to sync. Last sync: " + (last ? new Date(last).toLocaleString() : "never") + "." : "Sync is not set up on this device yet.") +
      " Storage: " + store.kind + (persisted ? ", kept by the browser" : "") + ". Build " + BUILD + ".";
    const exp = cfg.tokenExpires && Math.ceil((Date.parse(cfg.tokenExpires) - Date.now()) / 86400000);
    const al = $("alert");
    if (cfg.token && exp !== "" && exp <= 14) { al.textContent = exp < 0 ? "Your sync token has expired. Tap here to fix it." : "Sync token expires in " + exp + " days. Tap here."; al.classList.remove("hidden"); }
    else if (syncError) { al.textContent = syncError + " Tap here."; al.classList.remove("hidden"); }
    else al.classList.add("hidden");
  }
  $("alert").addEventListener("click", () => $("below").scrollIntoView({ behavior: "smooth" }));

  /* ---------- sync ---------- */
  let syncError = "", busy = false;
  const syncer = Sy.create({
    cfg: () => cfg,
    getEvents: () => events,
    addEvents: async (list) => { for (const e of list) if (!events.some((x) => x.id === e.id)) events.push(e); await store.putEvents(list); },
    getFlags: () => flags,
    addFlags: async () => {},
    meta: { get: (k, d) => store.getMeta(k, d), set: (k, v) => store.setMeta(k, v) },
    summary: () => {
      const s = E.summary(state, deck), words = {};
      for (const k in state.words) { const w = state.words[k]; words[k] = [w.box, w.seen, w.right, w.fb ? 1 : 0]; }
      return { generatedBy: device(), build: BUILD, introduced: s.introduced, learned: s.learned, weak: s.weak, falseBeliefs: s.falseBeliefs, accuracy: s.accuracy, answers: s.answers, boxes: s.boxes, words, note: "words: id -> [box, seen, right, falseBelief]" };
    },
  });
  async function syncNow(manual) {
    if (busy) return; if (!cfg.token) { if (manual) setSyncStatus("Enter a token first.", "err"); return; }
    if (!navigator.onLine) { if (manual) setSyncStatus("You are offline. Your answers are saved here and will sync when you are back online.", ""); return; }
    busy = true; $("syncBtn").disabled = true; if (manual) setSyncStatus("Syncing…", "");
    try {
      const r = await syncer.run();
      syncError = ""; retryN = 0;
      if (r.received) { state = E.replay(events); renderStats(); }
      setSyncStatus("Synced: sent " + r.sent + ", received " + r.received + " (" + r.calls + " requests).", "good");
    } catch (e) {
      const m = e && e.kind ? e.message : "Could not reach GitHub (" + (e && e.message) + "). Will try again later.";
      if (e && e.kind === "auth" || e && e.kind === "config") syncError = "Sync problem: " + e.message; 
      setSyncStatus(m, e && e.kind ? "err" : "");
      if (!(e && e.kind)) { // network trouble (for example just after reconnecting): try again shortly
        clearTimeout(syncTimer); syncTimer = setTimeout(() => syncNow(false), RETRY[Math.min(retryN, RETRY.length - 1)] * 1000); retryN++;
      }
    } finally { busy = false; $("syncBtn").disabled = false; renderDataNote(); }
  }
  let syncTimer = null, retryN = 0;
  const RETRY = [5, 15, 45, 120, 300];
  function syncSoon() { clearTimeout(syncTimer); syncTimer = setTimeout(() => syncNow(false), 1500); }
  function setSyncStatus(msg, cls) { const s = $("syncStatus"); s.textContent = msg; s.className = "note " + (cls || ""); }
  $("repoIn").value = cfg.repo; $("deviceIn").value = cfg.device; $("expIn").value = cfg.tokenExpires || "";
  $("tokenIn").placeholder = cfg.token ? "(saved: leave blank to keep)" : "github_pat_…";
  $("saveCfg").addEventListener("click", async () => {
    const oldDev = cfg.device;
    cfg.repo = $("repoIn").value.trim(); cfg.device = cleanName($("deviceIn").value);
    const t = $("tokenIn").value.trim(); if (t) cfg.token = t;
    cfg.tokenExpires = $("expIn").value || "";
    if (!cfg.ownNames.includes(cfg.device)) cfg.ownNames.push(cfg.device);
    $("deviceIn").value = cfg.device; $("tokenIn").value = ""; $("tokenIn").placeholder = cfg.token ? "(saved: leave blank to keep)" : "github_pat_…";
    await saveCfg(); syncError = "";
    setSyncStatus("Saved." + (oldDev !== cfg.device ? " Device name changed: new answers use the new name; earlier ones keep the old." : ""), "good");
    renderDataNote(); if (cfg.token) syncNow(true);
  });
  $("forgetTok").addEventListener("click", async () => { cfg.token = ""; await saveCfg(); setSyncStatus("Token removed from this device.", ""); renderDataNote(); });
  $("syncBtn").addEventListener("click", () => syncNow(true));
  addEventListener("online", () => { retryN = 0; syncSoon(); });
  setInterval(async () => { if (cfg.token && navigator.onLine && !busy && (await syncer.pending().catch(() => 0)) > 0) syncNow(false); }, 60000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") syncNow(false); });

  /* ---------- export / erase ---------- */
  $("exportBtn").addEventListener("click", () => {
    const data = JSON.stringify({ exportedAt: new Date().toISOString(), build: BUILD, device: device(), events: events.filter((e) => e.out !== "seed"), flags });
    const n = $("exportBox"); n.textContent = "";
    try {
      const a = el("a", null, "Download greek-vocab-export.json"); a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = "greek-vocab-export-" + new Date().toISOString().slice(0, 10) + ".json";
      a.style.display = "block"; a.style.margin = "8px 0"; n.append(a);
    } catch (e) {}
    const ta = el("textarea"); ta.style.cssText = "width:100%;height:110px;font:12px monospace"; ta.value = data;
    const cp = el("button", null, "Copy"); cp.addEventListener("click", () => { ta.select(); try { navigator.clipboard.writeText(ta.value); cp.textContent = "Copied"; } catch (e) { cp.textContent = "Select and copy"; } });
    n.append(ta, cp);
  });
  let armed = false;
  $("resetBtn").addEventListener("click", async (e) => {
    if (!armed) { armed = true; e.target.textContent = "Tap again: erase progress on THIS device"; setTimeout(() => { armed = false; e.target.textContent = "Erase this device's progress"; }, 4000); return; }
    await store.clearAll(); cfg = { repo: "mpcox/greek-vocab", branch: "data", token: "", tokenExpires: "", device: guessDevice(), ownNames: [guessDevice()] }; await saveCfg();
    events = E.mergeEvents(SEED, []); flags = []; state = E.replay(events); session = { recent: [], sinceNew: 99 }; todayN = 0;
    armed = false; e.target.textContent = "Erase this device's progress"; renderStats(); next();
  });

  document.querySelectorAll("[data-prev]").forEach((b) => b.addEventListener("click", () => {
    const r = +b.dataset.prev, pool = deck.cards.filter((c) => c.id <= 150);
    const c = pool[Math.floor(Math.random() * pool.length)];
    next({ id: c.id, rung: r, kind: "preview" });
  }));
  renderStats();
  next();
  if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
  if (cfg.token) syncSoon();
  window.__gv = { next, answer, get cur() { return cur; }, get state() { return state; }, deck };
})();
</script>
</body>
</html>
